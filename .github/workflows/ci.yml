name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Byte-compile dash.py
        run: python -m py_compile dash.py

      - name: AST-parse dash.py
        run: python -c "import ast; ast.parse(open('dash.py').read())"
